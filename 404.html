<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Lost in space</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <style>
      :root { --bg: #0a0b14; --fg: #f1f5f9; --muted: #94a3b8; }
      @media (prefers-color-scheme: light) { :root { --bg: #f8fafc; --fg: #0f172a; --muted: #475569; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: 'Space Grotesk', Inter, system-ui, sans-serif; overflow: hidden; text-align: center; padding: 16px; }
      .stars { position: fixed; inset: 0; background-image: radial-gradient(2px 2px at 20% 30%, #8b5cf6, transparent), radial-gradient(2px 2px at 70% 20%, #06b6d4, transparent), radial-gradient(1px 1px at 40% 80%, #3b82f6, transparent), radial-gradient(1.5px 1.5px at 85% 70%, #8b5cf6, transparent), radial-gradient(1px 1px at 10% 90%, #06b6d4, transparent); animation: twinkle 4s ease-in-out infinite alternate; }
      h1 { font-size: clamp(6rem, 25vw, 14rem); margin: 0; line-height: 1; font-weight: 800;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6, #06b6d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .phone { width: 70px; height: 130px; border: 5px solid #64748b; border-radius: 16px; margin: 0 auto 24px; position: relative;
        animation: float 4s ease-in-out infinite; background: linear-gradient(160deg, #3b82f655, #8b5cf655); }
      .phone::after { content: '?'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 42px; font-weight: 700; color: var(--fg); }
      p { color: var(--muted); font-size: 1.1rem; }
      a { display: inline-block; margin-top: 16px; padding: 12px 28px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 600;
        background: linear-gradient(90deg, #2563eb, #7c3aed); }
      @keyframes float { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-22px) rotate(8deg); } }
      @keyframes twinkle { to { opacity: 0.3; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <main style="position: relative">
      <div class="phone" aria-hidden="true"></div>
      <h1>404</h1>
      <p>This screen hasn't been built yet, or it floated off into space.</p>
      <a href="/portfolio/">Take me home</a>
    </main>
  </body>
</html>
